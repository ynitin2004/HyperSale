# Fallback CI, mirroring .github/workflows/ci.yml job for job.
#
# It exists so a GitHub Actions outage cannot leave main unverified. The two pipelines
# must stay in step: a change to one belongs in the other in the same commit, or the
# fallback quietly stops testing what the primary tests.
#
# The one deliberate difference is the database host. GitHub Actions maps service ports
# onto localhost; GitLab reaches a service by its alias, so DATABASE_URL points at
# `postgres` rather than `localhost`.

stages:
  - test
  - build

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

backend:
  stage: test
  image: python:3.12
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: hypersale
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hypersale
    # Integration tests skip silently without this, which would hide tenancy regressions.
    TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hypersale
  cache:
    key:
      files:
        - services/backend/pyproject.toml
    paths:
      - .cache/pip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    # GitLab starts a service but does not wait for it to accept connections.
    - |
      for _ in $(seq 1 30); do
        pg_isready -h postgres -U postgres -d hypersale && break
        sleep 2
      done
      pg_isready -h postgres -U postgres -d hypersale
    - cd services/backend
    - pip install -e '.[dev]'
  script:
    - ruff check .
    # Migrations apply and roll back cleanly.
    - alembic upgrade head
    - alembic downgrade base
    - alembic upgrade head
    # A drifted model is a silent production bug; autogenerate must find nothing to do.
    - alembic check
    - pytest -q
    # API contract matches the committed spec (RULES §5 codegen drift).
    - python -m app.openapi > ../../apps/web/src/api/openapi.json
    - git diff --exit-code -- ../../apps/web/src/api/openapi.json

image:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker build -t hypersale-backend:ci services/backend
    # The entrypoint must reject an unknown role with EX_USAGE (64).
    - |
      set +e
      docker run --rm -e PROCESS_ROLE=nonsense hypersale-backend:ci
      test $? -eq 64

web:
  stage: test
  image: node:20
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    # Match package.json and GitHub's pnpm/action-setup version source.
    - corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile=false
    # Generated TS client matches the spec (no hand-written API types).
    - pnpm --dir apps/web gen:api
    - git diff --exit-code -- apps/web/src/api/schema.d.ts
    - pnpm -r build

e2e:
  stage: test
  # Browsers and their system libraries come with the image; its tag must match the
  # @playwright/test version in apps/web/package.json.
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: hypersale_e2e
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hypersale_e2e
    E2E_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hypersale_e2e
    E2E_PYTHON: /opt/venv/bin/python
    CI: "true"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv postgresql-client
    - |
      for _ in $(seq 1 30); do
        pg_isready -h postgres -U postgres -d hypersale_e2e && break
        sleep 2
      done
    - python3 -m venv /opt/venv
    - /opt/venv/bin/pip install -e 'services/backend[dev]'
    - corepack enable
    - corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
  script:
    - pnpm install --frozen-lockfile=false
    - /opt/venv/bin/python scripts/e2e_setup.py
    - pnpm --dir apps/web exec playwright test
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - apps/web/playwright-report
