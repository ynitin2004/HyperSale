services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hypersale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hypersale"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hypersale-postgres:/var/lib/postgresql/data

volumes:
  hypersale-postgres:

