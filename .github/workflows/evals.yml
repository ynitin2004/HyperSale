name: Evals

# D38: paid re-score of the gold set through the product's scoring path, by hand only (D41): the
# gateway's WAF serves GitHub runners a browser-check page, so scoring changes are evaluated from
# a developer machine and CI replays the committed run. The only cost is the scoring key
# (~$1.75 per run). Skips cleanly when the key secret is not configured.
on:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    env:
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      # One model per run: an eval of the primary must not silently become an eval of the fallback.
      SCORING_FALLBACK_MODEL: ""
    steps:
      - uses: actions/checkout@v4
      - name: Skip without a scoring key
        id: key
        run: |
          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "::notice::ANTHROPIC_AUTH_TOKEN secret not set; paid eval skipped (the free replay gate still runs in CI)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - if: steps.key.outputs.run == 'true'
        run: pip install -e '.[dev]'
      - name: Re-score the gold set and gate it
        if: steps.key.outputs.run == 'true'
        run: python -m evals.harness --suite roleplay
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.run == 'true'
        with:
          name: eval-run
          path: services/backend/evals/runs/
