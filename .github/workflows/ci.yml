name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hypersale
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hypersale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hypersale
      # Integration tests skip silently without this, which would hide tenancy regressions.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hypersale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - name: Migrations apply and roll back cleanly
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Schema matches the ORM models
        # A drifted model is a silent production bug; autogenerate must find nothing to do.
        run: alembic check
      - run: pytest -q
      - name: API contract matches the committed spec (RULES §5 codegen drift)
        run: |
          python -m app.openapi > ../../apps/web/src/api/openapi.json
          git diff --exit-code -- ../../apps/web/src/api/openapi.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the single API/worker image
        run: docker build -t hypersale-backend:ci services/backend
      - name: Entrypoint rejects an unknown role
        run: |
          set +e
          docker run --rm -e PROCESS_ROLE=nonsense hypersale-backend:ci
          test $? -eq 64

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Read the exact version from package.json's packageManager field.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Generated TS client matches the spec (no hand-written API types)
        run: |
          pnpm --dir apps/web gen:api
          git diff --exit-code -- apps/web/src/api/schema.d.ts
      - run: pnpm -r build

  e2e:
    # The M1 loop in a real browser against stub voice + scoring providers (D31): no spend.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hypersale_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hypersale_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hypersale_e2e
      E2E_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hypersale_e2e
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: pip install -e 'services/backend[dev]'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: python scripts/e2e_setup.py
      - run: pnpm --dir apps/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
