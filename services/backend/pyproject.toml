[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypersale-backend"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "PyJWT[crypto]>=2.10,<3",
  "sqlalchemy>=2.0.38,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "alembic>=1.14,<2"]
migrations = ["alembic>=1.14,<2"]
# Exporters are optional: the app degrades to structured stdout logs without them.
telemetry = [
  "sentry-sdk[fastapi]>=2.20,<3",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated stubs with module-level identifiers by convention.
"alembic/versions/*" = ["E402"]
